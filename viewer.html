<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Görüntüleyici | Mobilya Shop 2K</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  </head>
  <body>
    <header>
      <div class="container navbar">
        <a href="index.html" class="brand" aria-label="2K ana sayfa"><span class="brand-mark">M</span><span>Mobilya</span></a>
        <nav class="nav-links" aria-label="Ana menü"><a href="index.html">Anasayfa</a><a href="index.html#products">Ürünler</a><a href="viewer.html?model=sandalye" class="active">3D Görünüm</a></nav>
        <div class="nav-actions"><a href="../index.html" class="btn btn-secondary">Orijinal site</a><a href="index.html" class="btn btn-primary">Ürünlere dön</a></div>
      </div>
    </header>

    <main class="viewer-page">
      <div class="container">
        <div class="viewer-shell">
          <div class="viewer-header"><h1 id="viewerTitle">3D Görüntüleyici</h1><a href="index.html#products" class="btn btn-secondary">Ürünlere dön</a></div>
          <div class="viewer-box">
            <model-viewer
              id="productViewer"
              alt="Optimize edilmiş 3D ürün modeli"
              src="sandalye-2k.glb"
              ar
              ar-modes="webxr scene-viewer quick-look"
              ar-placement="floor"
              ar-scale="fixed"
              camera-controls
              touch-action="pan-y"
              shadow-intensity="1"
              exposure="1.1"
              auto-rotate
              rotation-per-second="30deg"
              disable-tap
              environment-image="neutral"
              style="background-color: transparent;"
            ></model-viewer>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer"><div class="container footer-inner"><div>© 2026 Mobilya Shop · 2K model sürümü</div><div class="footer-links"><a href="../index.html">Orijinal site</a><a href="index.html#products">Ürünler</a></div></div></footer>

    <script>
      const models = {
        sandalye: { title: 'Sandalye 3D Görünüm', src: 'sandalye-2k.glb' },
        teklikoltukkrem: { title: 'Tekli Koltuk Krem 3D Görünüm', src: 'teklikoltukkrem-2k.glb' },
        kanepe: { title: 'Kanepe 3D Görünüm', src: 'kanepe-2k.glb' },
        makyajmasasi: { title: 'Makyaj Masası 3D Görünüm', src: 'makyajmasasi-2k.glb' },
        baza: { title: 'Baza 3D Görünüm', src: 'baza-2k.glb' },
        dolap: { title: 'Dolap 3D Görünüm', src: 'dolap-2k.glb' },
        'l-koltuk': { title: 'L Koltuk 3D Görünüm', src: 'l-koltuk-2k.glb' },
        sifonyer: { title: 'Şifonyer 3D Görünüm', src: 'sifonyer-2k.glb' }
      };

      const params = new URLSearchParams(window.location.search);
      const selected = models[params.get('model')] || models.sandalye;
      document.getElementById('viewerTitle').textContent = selected.title;
      document.title = selected.title + ' | Mobilya Shop 2K';
      const viewer = document.getElementById('productViewer');
      viewer.src = selected.src;
      viewer.alt = selected.title + ' - optimize edilmiş model';
    </script>
  </body>
</html>
