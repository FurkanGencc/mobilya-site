<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ürün Detayı | Mobilya Shop 2K</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container navbar">
        <a href="index.html" class="brand" aria-label="2K ana sayfa"><span class="brand-mark">M</span><span>Mobilya</span></a>
        <nav class="nav-links" aria-label="Ana menü"><a href="index.html">Anasayfa</a><a href="index.html#products" class="active">Ürünler</a><a href="viewer.html?model=sandalye">3D Görünüm</a></nav>
        <div class="nav-actions"><button class="btn btn-secondary">Sepet</button><button class="btn btn-primary">Satın Al</button></div>
      </div>
    </header>

    <main class="product-detail">
      <div class="container">
        <div class="product-detail-card">
          <img id="productImage" src="" alt="Ürün görseli" />
          <div class="product-detail-copy">
            <span class="kicker">2K model sürümü</span>
            <h1 id="productName">Ürün adı</h1>
            <div class="price" id="productPrice">₺0</div>
            <p id="productDescription"></p>
            <ul class="feature-list"><li>Yüksek konforlu kullanım</li><li>Günlük kullanıma uygun tasarım</li><li>Optimize 3D model</li></ul>
            <div class="detail-actions"><a id="viewerLink" href="viewer.html?model=sandalye" class="btn btn-primary">3D Görüntüle</a><a href="index.html" class="btn btn-secondary">Geri Dön</a></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" id="contact"><div class="container footer-inner"><div>© 2026 Mobilya Shop · 2K model sürümü</div><div class="footer-links"><a href="index.html#products">Ürünler</a><a href="../index.html">Orijinal site</a></div></div></footer>

    <script>
      const products = {
        sandalye: { name: 'Sandalye', price: '₺3.900', description: 'Modern ve rahat tasarımıyla günlük kullanım için uygun, şık bir sandalye seçeneği.', image: 'sandalye.jpeg', model: 'sandalye' },
        'beige-armchair': { name: 'Beige Accent', price: '₺5.400', description: 'Krem tonlarında, sıcak ve rahat his veren modern koltuk.', image: 'armchair_PNG7062.png', model: 'teklikoltukkrem' },
        kanepe: { name: 'Kanepe', price: '₺8.900', description: 'Konforlu oturma alanı ve sade tasarımıyla salonunuza uyum sağlar.', image: 'kanepe.jfif', model: 'kanepe' },
        makyajmasasi: { name: 'Makyaj Masası', price: '₺7.500', description: 'İşlevsel depolama alanı ve zarif görünümüyle günlük hazırlık alanınıza düzen katar.', image: 'makyaj_masası.jfif', model: 'makyajmasasi' },
        baza: { name: 'Baza', price: '₺12.500', description: 'Yatak odanızda ek depolama alanı sağlayan kullanışlı baza.', image: 'baza.jpeg', model: 'baza' },
        dolap: { name: 'Dolap', price: '₺14.500', description: 'Geniş depolama alanı ve sade tasarımıyla yatak odanıza uyum sağlar.', image: 'dolap.jfif', model: 'dolap' },
        'l-koltuk': { name: 'L Koltuk', price: '₺18.900', description: 'Geniş oturma alanı ve köşe formuyla salonunuzda rahat kullanım sunar.', image: 'l_koltuk.jfif', model: 'l-koltuk' },
        sifonyer: { name: 'Şifonyer', price: '₺6.900', description: 'Günlük eşyalarınız için işlevsel çekmece alanı sunar.', image: 'şifonyer.jfif', model: 'sifonyer' }
      };

      const params = new URLSearchParams(window.location.search);
      const product = products[params.get('product')] || products.sandalye;
      document.title = product.name + ' | Mobilya Shop 2K';
      document.getElementById('productImage').src = product.image;
      document.getElementById('productImage').alt = product.name;
      document.getElementById('productName').textContent = product.name;
      document.getElementById('productPrice').textContent = product.price;
      document.getElementById('productDescription').textContent = product.description;
      document.getElementById('viewerLink').href = 'viewer.html?model=' + product.model;
    </script>
  </body>
</html>
